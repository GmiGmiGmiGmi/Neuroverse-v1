[build]
  command = "npm run build"
  publish = "docs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hash routing works without rewrites. If you later switch to history routing,
# add a SPA fallback redirect to /index.html.
